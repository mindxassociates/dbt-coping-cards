<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBT Coping Cards | DBT 应对技能卡</title><meta name="description" content="互动式中文 DBT 应对技能卡：搜索、收藏、复制和导出适合自己的应对卡。"><style>:root{--bg:#f4f7f6;--p:#fff;--t:#17221e;--m:#68756f;--l:#dfe7e3;--a:#2f6f61;--s:#e8f3ef}html[data-theme=dark]{--bg:#101613;--p:#18211e;--t:#edf5f2;--m:#a8b5b0;--l:#2b3934;--a:#91c6b6;--s:#20332c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,color-mix(in srgb,var(--a) 10%,transparent),transparent 28rem),var(--bg);color:var(--t);font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--l)}.bar{max-width:1160px;margin:auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:800}.acts{display:flex;gap:7px;flex-wrap:wrap}.btn,.chip{border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:14px;padding:8px 11px;text-decoration:none}.btn:hover,.chip:hover{background:var(--s)}.wrap{max-width:1160px;margin:auto;padding:34px 18px 70px}.hero{padding:30px;border:1px solid var(--l);border-radius:30px;background:linear-gradient(145deg,var(--p),color-mix(in srgb,var(--s) 40%,var(--p)));box-shadow:0 20px 60px rgba(31,63,54,.09);margin-bottom:20px}.ey{color:var(--a);font-weight:800;font-size:12px;letter-spacing:.08em}h1{font-size:clamp(2.2rem,7vw,4.5rem);line-height:1;margin:10px 0 14px;letter-spacing:-.04em}.lead{max-width:720px;color:var(--m);font-size:1.05rem}.tools{position:sticky;top:64px;z-index:4;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);padding:10px 0}.search{width:100%;padding:13px 15px;border:1px solid var(--l);border-radius:15px;background:var(--p);color:var(--t);outline:none}.filters{display:flex;gap:8px;overflow:auto;padding:10px 0;scrollbar-width:none}.chip{white-space:nowrap}.chip.on{background:var(--a);color:#fff;border-color:var(--a)}.meta{color:var(--m);margin:2px 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--p);border:1px solid var(--l);border-radius:22px;padding:19px;box-shadow:0 8px 26px rgba(31,63,54,.055);display:flex;flex-direction:column;min-height:230px;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 16px 38px rgba(31,63,54,.1)}.head{display:flex;justify-content:space-between;gap:8px}.tag{font-size:12px;font-weight:750;color:var(--a);background:var(--s);padding:5px 8px;border-radius:999px}.save{border:1px solid var(--l);background:transparent;color:var(--m);border-radius:11px;padding:5px 9px}.save.on{background:var(--s);color:var(--a)}h2{font-size:1.18rem;line-height:1.25;margin:14px 0 9px}.body{color:var(--m);flex:1}.body b{color:var(--t)}.foot{display:flex;gap:8px;margin-top:14px}.mini{border:0;background:var(--s);color:var(--a);border-radius:10px;padding:7px 10px}.footer{margin-top:45px;border-top:1px solid var(--l);padding-top:22px;color:var(--m);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.footer a{color:var(--a);font-weight:700}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,10px);opacity:0;background:var(--t);color:var(--bg);padding:9px 14px;border-radius:999px;transition:.2s;z-index:9}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.wrap{padding:22px 12px 60px}.hero{padding:22px;border-radius:24px}.grid{grid-template-columns:1fr}.card{min-height:0}.bar{padding:10px 12px}.hide{display:none}.tools{top:58px}}</style></head><body><header class="top"><div class="bar"><div class="brand">DBT Coping Cards</div><div class="acts"><button class="btn" id="saved">收藏 <span id="n">0</span></button><button class="btn hide" id="copySaved">复制收藏</button><button class="btn" id="export">导出</button><a class="btn" href="../">EN</a><button class="btn" id="theme" aria-label="切换深色模式">◐</button></div></div></header><main class="wrap"><section class="hero"><div class="ey">互动式 DBT 技能库</div><h1>DBT 应对技能卡</h1><p class="lead">需要的时候，快速找到一项可以实际使用的技能。搜索或筛选卡片，收藏对你有帮助的内容，并建立自己的应对卡组。</p></section><div class="tools"><input class="search" id="q" type="search" placeholder="搜索：焦虑、界限、智慧心……"><div class="filters" id="filters"></div></div><div class="meta" id="meta"></div><section class="grid" id="grid"></section><footer class="footer"><div>这些卡片用于技能练习与心理教育，不能替代专业诊断、心理治疗或危机服务。</div><div>由 <a href="https://mindx.us/zh/" target="_blank" rel="noopener">Mind X社区</a> 开发</div></footer></main><div class="toast" id="toast"></div><script>const cards=[
['成长型思维','视角转换','把“做不到”改成“还在学习”：我还在学；我可以换一种方法试试；犯错也能帮助我进步。'],['智慧心','正念','智慧心位于情绪与理性之间。看见两者、尊重两者，再从更稳定、清醒的位置作出选择。'],['可控圈','视角转换','压力上来时，把事情分成：无法控制、可以影响、以及可以直接控制的部分。'],['DBT 核心概览','DBT 基础','DBT 关注想法、情绪和行为之间的相互影响。核心技能包括正念、情绪调节、痛苦耐受和人际效能。'],['理性心','正念','偏逻辑、分析的状态。适合处理事实、计划、时间安排、学习和实际问题。'],['情绪心','正念','情绪强烈影响想法和行动的状态。此时事实可能更难看清，行动冲动也可能随着情绪强度升高。'],['智慧心：两者的交汇','正念','智慧心整合理性与情绪，通常更像一种安静、稳定、带直觉感的清晰。'],['辩证思维','视角转换','练习同时容纳两个真实：我很坚强，也会脆弱；我已经尽力，也还需要继续努力；我可以在乎别人，也可以设界限。'],['GIVE','人际关系','G 温和（Gentle）；I 感兴趣（Interested）；V 验证（Validate）；E 轻松自然（Easy manner）。当维护关系很重要时使用。'],['疗愈不是直线','视角转换','进步可能包含绕路、停顿、反复和退步。一天过得很难，并不会抹去之前已经走过的路。'],['方形呼吸','稳定与落地','吸气、停顿、呼气、停顿，使用相等且舒适的节奏。让呼吸成为注意力的稳定落点。'],['STOP','痛苦耐受','S 停下来。T 退一步。O 观察内外正在发生什么。P 有意识地继续。'],['FAST','人际关系','F 公平。减少不必要的 A 道歉。S 坚持价值。T 诚实。用于维护自尊。'],['彻底接纳：自我提醒','接纳','提醒自己：事情已经发生了；过去无法改变；此刻我仍可以选择怎样回应。'],['彻底接纳：练习','接纳','先让身体慢下来，观察想法，给情绪命名，把感受和事实分开，再温和地回到此刻真实发生的事情。'],['DEAR MAN','人际关系','D 描述；E 表达；A 提出请求或拒绝；R 强化；M 保持专注；A 表现自信；N 协商。'],['ACCEPTS','痛苦耐受','用活动、帮助他人、比较、相反情绪、暂时搁置、其他想法和感官刺激，帮助自己度过当下。'],['焦虑时的应对语','焦虑','我可以慢下来呼吸。这种感觉很不舒服，但不一定代表危险。我可以允许这份感觉慢慢过去。'],['创伤触发点','觉察','触发点可能包括无助感、巨响、某些场景、失去的提醒、被拒绝、压力过载、记忆、批评或羞耻。给触发点命名，能增加选择空间。'],['TIPP','痛苦耐受','情绪压倒性强烈时，可使用温度变化、短暂而安全的较强运动、延长呼气的呼吸，以及配对肌肉放松。若有相关健康问题，请先与专业人士讨论。'],['焦虑循环','焦虑','害怕的情境可能引发警觉、担忧和回避。回避短期内会让焦虑下降，却可能在长期强化恐惧。'],['你对自己说的话很重要','视角转换','自我语言可能加重羞耻，也可能为解决问题腾出空间。尽量使用准确、尊重、有效的自我对话。'],['想法不等于事实','认知技能','想法是一种心理事件，不是证据。先注意它、给它命名，再检查真正支持它的事实。'],['健康的应对方式','自我照顾','散步、休息、需要时哭一哭、冥想、写下来、阅读、暂停一下、练习呼吸、活动身体，或用更友善的方式和自己说话。'],['常见认知偏差','认知技能','留意确认偏误、光环效应、后见之明偏误、锚定效应、从众效应、虚假共识、错误信息效应、选择支持偏误和自利偏误。'],['有情绪是可以的','接纳','情绪本身可以存在。你可以给情绪留出空间，同时不必执行伴随它出现的每一个冲动。'],['如果事情最后会顺利呢？','视角转换','当大脑不断排练最坏结果时，也刻意为中性或较好的可能性留出空间。'],['我能控制什么','视角转换','把注意力放在自己的选择、努力、态度、界限、学习、自我照顾和回应方式上。'],['5-4-3-2-1 落地练习','稳定与落地','说出 5 个看到的东西、4 个触摸或感觉到的东西、3 个听到的声音、2 个闻到的气味、1 个尝到的味道。'],['这样也可以','自我关怀','你可以做自己、犯错、说“不”、不知道所有答案、寻求帮助，也可以有很难熬的一天。'],['界限表达句','人际关系','我可以帮忙，但不能替你做。我需要一点时间，之后再继续谈。我尊重你的看法，但这个决定由我来做。'],['给自己的便签','自我关怀','你已经在尽自己所能。继续往前。'],['焦虑冰山','焦虑','表面上看到的是焦虑，下面可能还藏着尴尬、被拒绝感、内疚、愤怒、孤独、失眠、烦躁、担忧、不安全感和注意力困难。'],['挑战负面想法','认知技能','问自己：我是不是过早下结论？有没有更有帮助的想法？如果是朋友遇到这件事，我会怎么说？还有哪些可能结果？'],['自我照顾清单','自我照顾','补水、休息、散步、写日记、冥想、伸展、阅读、和支持你的人相处、整理环境、减少社交媒体、保护睡眠。'],['可以放下的东西','接纳','练习放下无法控制的事情、完美主义、自我比较、取悦所有人的需要、对失败的恐惧，以及过度控制。'],['善待自己，勇敢一点，做自己','自我关怀','勇敢并不要求你放弃对自己的温柔。'],['“还没有”的力量','视角转换','在固定结论后加上“还没有”：我现在还做不到；我还没有理解；我还没有弄明白。'],['彩虹落地练习','稳定与落地','先呼吸一下，再按顺序寻找周围不同的颜色。让视觉搜索把注意力带回此时此地。'],['你可以的','自我关怀','当下一步很难时，给自己一个简短的坚持提示。'],['我无法预测未来','应对语','我无法预测未来，而我可以练习和这份不确定性共处。'],['我以前也经历过困难','应对语','我以前已经处理过困难的事情，这一次我也可以一步一步走过去。'],['我可以选择自己的回应','应对语','我也许无法改变事情本身，但我仍可以影响自己如何回应。'],['我可以保持弹性','应对语','事情不会总按我的方式发展，而我可以调整，而不是和每一个变化对抗。'],['我在乎自己，也在乎别人','应对语','我的需要也重要。照顾自己和关心别人可以同时存在。'],['今天会有它自己的样子','应对语','我可以面对今天真实发生的样子，而不是要求它必须符合一个完美计划。'],['过去不等于未来','应对语','过去是我故事的一部分，但它不是对未来的固定预测。'],['我可以给自己时间疗愈','应对语','疗愈需要时间。我可以用自己能持续承受的节奏往前走。'],['我可以接纳自己的感受','应对语','我可以允许感受存在，而不必现在就把整个问题解决掉。'],['生命仍值得去生活','应对语','痛苦可以存在，同时也不必抹去意义、连接，以及建立值得生活的人生的可能。'],['接纳不是软弱','应对语','接纳意味着足够清楚地看见现实，从而能选择下一步更有效的行动。'],['我的需要和愿望很重要','应对语','即使我也在乎别人的需要，我自己的需要和愿望也值得被认真考虑。'],['我的想法不会决定我的人生','应对语','想法会影响我，但它们不必替我决定行动。'],['我可以学着面对变化','应对语','变化可能让人不舒服，而我仍可以逐渐学会适应和应对。'],['我可以保留自己的主动权','应对语','我可以把注意力放回自己拥有的选择，而不是把全部力量交给别人或环境。'],['有些日子不会按计划进行','应对语','计划被打乱，不代表这一天失败了。我可以重新整理，再选择下一步有帮助的行动。'],['照顾自己不需要内疚','应对语','自我照顾不是一种道德上的错误。我可以照顾自己，而不必为此承担多余的内疚。'],['小步也是进步','应对语','进步不一定要很大。微小但重复的行动，同样算数。'],['我有勇气说“不”','应对语','说“不”可以是一种清晰、安全和自尊的表达。'],['这是一次学习应对的机会','应对语','恐惧也可以成为练习应对的地方，而不一定意味着我必须逃开。']].map((x,i)=>({t:x[0],c:x[1],b:x[2],id:i+1}));const $=s=>document.querySelector(s),grid=$('#grid'),q=$('#q'),filters=$('#filters'),meta=$('#meta'),count=$('#n');let state={q:'',cat:'全部',only:false,stars:new Set(JSON.parse(localStorage.getItem('dbt-zh-stars')||'[]'))};const cats=['全部',...new Set(cards.map(x=>x.c))];const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function list(){return cards.filter(x=>(state.cat==='全部'||x.c===state.cat)&&(!state.q||(x.t+x.c+x.b).toLowerCase().includes(state.q.toLowerCase()))&&(!state.only||state.stars.has(x.id)))}function render(){filters.innerHTML=cats.map(c=>`<button class="chip ${state.cat===c?'on':''}" data-c="${c}">${c}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.cat=b.dataset.c;render()});let a=list();count.textContent=state.stars.size;meta.textContent=`显示 ${a.length} 张卡片${state.only?' · 已收藏':''}`;grid.innerHTML=a.length?a.map(x=>`<article class="card"><div class="head"><span class="tag">${x.c}</span><button class="save ${state.stars.has(x.id)?'on':''}" data-s="${x.id}">${state.stars.has(x.id)?'已收藏':'收藏'}</button></div><h2>${x.t}</h2><div class="body">${x.b}</div><div class="foot"><button class="mini" data-copy="${x.id}">复制文字</button></div></article>`).join(''):'<p>没有符合条件的卡片。</p>';grid.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{let id=+b.dataset.s;state.stars.has(id)?state.stars.delete(id):state.stars.add(id);localStorage.setItem('dbt-zh-stars',JSON.stringify([...state.stars]));render()});grid.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyCard(+b.dataset.copy))}async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true}}catch(e){}try{let a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}}function msg(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}async function copyCard(id){let x=cards.find(x=>x.id===id);msg(await copyText(x.t+'\n'+x.b)?'已复制':'复制失败')}q.oninput=e=>{state.q=e.target.value;render()};$('#saved').onclick=()=>{state.only=!state.only;render()};$('#copySaved').onclick=async()=>{let a=cards.filter(x=>state.stars.has(x.id));if(!a.length)return msg('请先收藏卡片');msg(await copyText(a.map(x=>x.t+'\n'+x.b).join('\n\n---\n\n'))?'已复制收藏卡片':'复制失败')};$('#export').onclick=()=>{let a=cards.filter(x=>state.stars.has(x.id));if(!a.length)return msg('请先收藏卡片');let html='<!doctype html><meta charset=utf-8><title>我的 DBT 应对卡</title><style>body{font-family:system-ui;max-width:800px;margin:30px auto;padding:0 18px}article{border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}</style><h1>我的 DBT 应对卡</h1>'+a.map(x=>`<article><small>${x.c}</small><h2>${x.t}</h2><p>${x.b}</p></article>`).join('');let u=URL.createObjectURL(new Blob([html],{type:'text/html'})),e=document.createElement('a');e.href=u;e.download='我的-DBT-应对卡.html';e.click();URL.revokeObjectURL(u)};$('#theme').onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'':'dark';localStorage.setItem('dbt-zh-theme',d?'light':'dark')};if(localStorage.getItem('dbt-zh-theme')==='dark')document.documentElement.dataset.theme='dark';render();</script></body></html>
